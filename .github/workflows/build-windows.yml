name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Download ffmpeg
        run: |
          $url = 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip'
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_tmp
          $inner = Get-ChildItem -Path ffmpeg_tmp -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path ffmpeg\bin | Out-Null
          Copy-Item "$($inner.FullName)\bin\ffmpeg.exe" -Destination ffmpeg\bin\ffmpeg.exe

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $line = Get-Content src/__init__.py | Where-Object { $_ -match '^__version__' }
          $ver = ($line -split '=')[1].Trim().Trim('"').Trim("'")
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version: $ver"

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name "YoutubeDownloader-v${{ steps.version.outputs.version }}" `
            --add-binary "ffmpeg\bin\ffmpeg.exe;ffmpeg/bin" `
            src/main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YoutubeDownloader-v${{ steps.version.outputs.version }}
          path: dist/YoutubeDownloader-v${{ steps.version.outputs.version }}.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/YoutubeDownloader-v${{ steps.version.outputs.version }}.exe
          fail_on_unmatched_files: true
