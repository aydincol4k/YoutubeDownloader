[project]
name = "youtube-downloader-windows"
version = "0.1.0"
description = "Windows YouTube downloader with Shorts and playlist support"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp>=2024.10.7",
    "PySide6>=6.7",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.scripts]
youtube-downloader = "src.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
